# Docker Compose for local development (Postgres only).
# Django runs outside containers via `uv run`.
# Data persists across `docker compose down`; `down -v` wipes it.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drover}
      POSTGRES_USER: ${POSTGRES_USER:-drover}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      # Loopback only: never expose dev Postgres (with dev credentials) to the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - drover-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drover} -d ${POSTGRES_DB:-drover}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  drover-pgdata: