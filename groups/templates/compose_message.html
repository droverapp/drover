{% extends 'base.html' %}
{% load static %}

{% block content %}
  {% include 'header.html' with title="Write Message" nav_menu=True %}
  <div class="container">
    <form class="form-container" method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="form-group">
        <label for="message">
            Compose Message To {% if is_admin %}Your Group {% else %}Group Admins {% endif %}
        </label><br />
        {% if is_admin and events %}
        <div class="form-row mb-3">
          <div class="form-group col-md-6">
            <label for="event_id">Filter by Event (optional)</label>
            <select class="form-control" name="event_id" id="event_id">
              <option value="">All Group Members</option>
              {% for event in events %}
                {% if selected_event_id == event.id|stringformat:"s" %}
                  <option value="{{ event.id }}" selected>{{ event.name }}</option>
                {% else %}
                  <option value="{{ event.id }}">{{ event.name }}</option>
                {% endif %}
              {% endfor %}
            </select>
          </div>
          <div class="form-group col-md-6">
            <label for="rsvp_status">RSVP Status (optional)</label>
            <select class="form-control" name="rsvp_status" id="rsvp_status">
              <option value="">All RSVPs for Event</option>
              {% for status_value, status_label in rsvp_choices %}
                {% if selected_rsvp_status == status_value %}
                  <option value="{{ status_value }}" selected>{{ status_label }}</option>
                {% else %}
                  <option value="{{ status_value }}">{{ status_label }}</option>
                {% endif %}
              {% endfor %}
            </select>
          </div>
        </div>
        {% endif %}
        <div class="glyphicon glyphicon-picture message-image-container" title="upload image for the conversation">
          <input type="file" name="message-image" />
          <img src="" role="presentation" id="uploaded-image" accept="image/x-png,image/gif,image/jpeg" />
        </div>
        <textarea class="form-control" name="message" id="message" rows="10"></textarea>
      </div>
      <div style="text-align: center;">
        <button class="btn btn-primary btn-blue" type="submit">Send</button>
      </div>
    </form>
  </div>
  {% include 'footer.html' with show_logo=True %}
{% endblock %}
{% block page_js %}
<script src="{% static 'js/preview_image.js' %}"></script>
{% endblock %}
