{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="landing">
  <div class="landing-container">
    <div class="landing-logo">
      <img src="{% static 'img/drover_final_logo.svg' %}" />
      <p class="tagline">One Stop Communication</p>
    </div>
  </div>
  <div class="signup-container" style="color: #ffffff; padding: 1rem;">
    <h4>Reset Password</h4><hr style="border-color: white;height: 1px;width: 80%;" />
    <p>Enter your account email address and we will send you a password reset link.</p>
    <form class="form-container" method="post">
      {% csrf_token %}
      <div class="control-group">
        <label class="control-label" for="id_email">Email</label>
        <div class="controls">
          <input class="form-control" type="email" name="email" id="id_email" placeholder="Email" required>
        </div>
      </div>
      <div class="control-group" style="text-align: center;">
        <div class="controls" style="margin-top: 1rem;text-align: center;">
          <button type="submit" class="btn btn-primary btn-orange">Send Reset Link</button>
        </div>
        <a href="{% url 'login' %}">Back to Login</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
