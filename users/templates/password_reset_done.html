{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="landing">
  <div class="landing-container">
    <div class="landing-logo">
      <img src="{% static 'img/drover_final_logo.svg' %}" />
      <p class="tagline">One Stop Communication</p>
    </div>
  </div>
  <div class="signup-container" style="color: #ffffff; padding: 1rem; text-align: center;">
    <h4>Check Your Email</h4><hr style="border-color: white;height: 1px;width: 80%;" />
    <p>If an account exists for that email address, we've sent instructions for resetting your password.</p>
    <a class="btn btn-primary btn-orange" href="{% url 'login' %}">Back to Login</a>
  </div>
</div>
{% endblock %}
