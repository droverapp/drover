[project]
name = "drover"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "psycopg[binary]>=3.2.5",
    "django-ckeditor>=6.3.2",
    "django-environ>=0.11",
    "granian>=1.7.6",
    "pillow>=11.1.0",
    "sendgrid>=6.11",
    "twilio>=9.0",
    "whitenoise>=6.9.0",
    "bleach>=6.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"