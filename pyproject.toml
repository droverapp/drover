[project]
name = "drover"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "psycopg[binary]>=3.2.5",
    "django-ckeditor>=6.3.2",
    "django-environ>=0.11",
    "granian>=1.7.6",
    "pillow>=11.1.0",
    "sendgrid>=6.11",
    "twilio>=9.0",
    "whitenoise>=6.9.0",
    "bleach>=6.2.0",
    "pywebpush>=2.5.0,<3",
    "requests>=2.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
test = [
    "coverage[toml]>=7.6",
    "django-coverage-plugin>=3.2.2",
    "inline-snapshot-django>=1.4.0",
    "inline-snapshot>=0.36.0",
    "pytest>=8",
    "pytest-django>=4.14.0",
    "ruff>=0.11.0",
]

[tool.coverage.run]
branch = true
source = ["drover", "groups", "users", "public", "shortener"]
plugins = ["django_coverage_plugin"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "drover.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[tool.inline-snapshot]
format-command = "ruff format --stdin-filename {filename} -"
